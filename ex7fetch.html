<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo fetch in JS</title>
    <script>
        const URL = "https://dummyjson.com/products";
        async function loadProduct() {
            try {
                const ele1=document.getElementById("data");
                const res = await fetch(URL);
                const data = await res.json();
                console.log("data = ", data);
                console.log("res = ", res);
                data.products.map((i)=>{
                    ele1.innerHTML = <tr>
                        <td>${i.id}</td>
                        <td>${i.title}</td>
                        <td>${i.category}</td>
                        <td>${i.price}</td>
                        <td>${i.rating}</td>
                    </tr>
                })
            }
            catch (err) {
                console.log("Error in fetching data = ", err);
            }
        }
        loadProduct();
        
        
    </script>
    <style> 
        table {
            margin: auto;
            padding: 10px;
            background-color: green;
            border: 1px solid black;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Title</th>
                <th>Category</th>
                <th>Price</th>
                <th>Rating</th>
            </tr>
        </thead>
        <tbody id="data1">

        </tbody>
    </table>
</body>
</html>
